<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaga Match</title>
  </head>
  <body class="pp">
    <header class="pp-bar">
      <p class="pp-brand"><span>Vaga</span> <span class="pp-brand__mark">Match</span></p>
      <div class="pp-actions">
        <button type="button" class="pp-icon-button" id="refresh" aria-label="Analisar de novo" title="Analisar de novo">
          <svg class="icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M16 10a6 6 0 11-1.8-4.3M16 3.5V7h-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button type="button" class="pp-text-button" id="resume">Meu currículo</button>
      </div>
    </header>
    <main class="pp-main" id="main" tabindex="-1"></main>
    <footer class="pp-foot">
      <svg class="icon" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M6 9V6.5a4 4 0 018 0V9M5 9h10a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <span>Lê só esta aba, quando você clica. Nada sai do navegador.</span>
    </footer>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
